name: Tests
on:
  workflow_dispatch:
  push:
    branches: [main, "feat/**", "feature/**", "security/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax and encoding
        shell: powershell
        run: |
          $bytes = [System.IO.File]::ReadAllBytes("RUN-BUSINESS-STARTER.ps1")
          if ($bytes.Length -lt 3 -or $bytes[0] -ne 0xEF -or $bytes[1] -ne 0xBB -or $bytes[2] -ne 0xBF) {
            throw "PowerShell script must be UTF-8 with BOM for Windows PowerShell 5.1."
          }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("RUN-BUSINESS-STARTER.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }
          Write-Host "Windows PowerShell 5.1 syntax and UTF-8 BOM OK"
